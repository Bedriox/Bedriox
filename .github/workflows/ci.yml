name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.4', '8.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Bedriox
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, openssl, sockets, sodium
      - name: Read immutable component pins
        id: component-pins
        shell: pwsh
        working-directory: Bedriox
        run: php tools/export-component-pins.php | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Bedriox/Protocol
          ref: ${{ steps.component-pins.outputs.protocol_commit }}
          path: Protocol
          token: ${{ secrets.BEDRIOX_COMPONENTS_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Bedriox/RakNet
          ref: ${{ steps.component-pins.outputs.raknet_commit }}
          path: RakNet
          token: ${{ secrets.BEDRIOX_COMPONENTS_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Bedriox/Data
          ref: ${{ steps.component-pins.outputs.data_commit }}
          path: Data
          token: ${{ secrets.BEDRIOX_COMPONENTS_TOKEN }}
          persist-credentials: false
      # Static/unit CI uses stock PHP; native LevelDB interoperability is qualified by the pinned Bedriox Runtime job.
      - run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-leveldb
        working-directory: Bedriox
      - run: composer check
        working-directory: Bedriox
      - run: php bin/bedriox --version
        working-directory: Bedriox
