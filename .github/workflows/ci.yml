name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Bedriox
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, openssl, sockets, sodium, zip
      - name: Read immutable component pins
        id: component-pins
        shell: pwsh
        working-directory: Bedriox
        run: php tools/export-component-pins.php | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Bedriox/Protocol
          ref: ${{ steps.component-pins.outputs.protocol_commit }}
          path: Protocol
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Bedriox/NetherNet
          ref: ${{ steps.component-pins.outputs.nethernet_commit }}
          path: NetherNet
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Bedriox/Data
          ref: ${{ steps.component-pins.outputs.data_commit }}
          path: Data
          persist-credentials: false
      # Routine CI uses stock PHP for static and metadata checks. Native LevelDB and WebRTC interoperability are qualified by Runtime.
      - run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-leveldb --ignore-platform-req=ext-webrtc
        working-directory: Bedriox
      - run: composer check:ci
        working-directory: Bedriox
      - name: Run focused development security regressions
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        run: >-
          vendor/bin/phpunit
          tests/Api/FormApiTest.php
          tests/Authentication
          tests/Login
          tests/Plugin/FormRegistryTest.php
          tests/Runtime/BedrockPlayChannelTest.php
          tests/Runtime/RuntimeDiagnosticsTest.php
          tests/Simulation/KillDamageTest.php
          tests/Simulation/PlayerLifecycleTest.php
          tests/Tools/BoundedSplitValidatorTest.php
        working-directory: Bedriox
      - name: Run full test suite
        if: github.event_name != 'push' || github.ref != 'refs/heads/development'
        run: composer test
        working-directory: Bedriox
      - run: php bin/bedriox --version
        working-directory: Bedriox
