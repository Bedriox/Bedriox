name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: Bedriox
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, openssl, sockets, sodium, zip
      - name: Read immutable component pins
        id: component-pins
        shell: pwsh
        working-directory: Bedriox
        run: php tools/export-component-pins.php | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Bedriox/Protocol
          ref: ${{ steps.component-pins.outputs.protocol_commit }}
          path: Protocol
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Bedriox/RakNet
          ref: ${{ steps.component-pins.outputs.raknet_commit }}
          path: RakNet
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Bedriox/Data
          ref: ${{ steps.component-pins.outputs.data_commit }}
          path: Data
          persist-credentials: false
      # Routine CI uses stock PHP for static and metadata checks. Native LevelDB interoperability is qualified by Runtime.
      - run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-leveldb
        working-directory: Bedriox
      - run: composer check:ci
        working-directory: Bedriox
      - run: php bin/bedriox --version
        working-directory: Bedriox
