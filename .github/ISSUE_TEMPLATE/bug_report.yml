name: Bug report
description: Report a reproducible problem with Bedriox. Do not disclose security vulnerabilities here.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Bedriox. Search existing issues before submitting a new report.

        Security vulnerabilities must be reported through SECURITY.md and must not be disclosed in this public form.

  - type: input
    id: bedriox-version
    attributes:
      label: Bedriox version
      description: Run `bedriox --version`, `bedriox.cmd --version`, or `/version` and paste the exact result.
      placeholder: Bedriox 1.0.0-beta.1
    validations:
      required: true

  - type: input
    id: bedrock-version
    attributes:
      label: Minecraft Bedrock version
      description: Include the complete client version and platform.
      placeholder: 1.xx.xx on Windows, Android, iOS, Xbox, PlayStation, or Switch
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Server environment
      description: Include the operating system, CPU architecture, installation method, and any relevant hosting or container details.
      placeholder: Windows 11 x86-64, installed with the official PowerShell installer
    validations:
      required: true

  - type: textarea
    id: plugins
    attributes:
      label: Installed plugins
      description: List every installed plugin and its version. Write "None" if the problem occurs without plugins.
      placeholder: |
        PluginTools 0.1.0
        ExamplePlugin 1.0.0
    validations:
      required: true

  - type: textarea
    id: attempted-action
    attributes:
      label: What were you trying to do?
      description: Describe the player action, command, configuration change, or server operation that exposed the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest exact sequence that consistently reproduces the problem.
      placeholder: |
        1. Start the server with ...
        2. Join using ...
        3. Run or interact with ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Explain what happened instead, including any disconnect or client-facing error text.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Sometimes
        - Happened once
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: Include only settings related to the problem. Remove credentials, tokens, and unrelated private information.
      render: text

  - type: textarea
    id: diagnostics
    attributes:
      label: Logs and crash reports
      description: Drag sanitized server logs or crash reports here. Do not include JWTs, credentials, encryption material, or unrelated personal information.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, videos, timing details, or other information that may help reproduce the problem.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I have not included credentials, authentication tokens, encryption material, or unrelated personal information.
          required: true
        - label: This is not a security vulnerability.
          required: true
